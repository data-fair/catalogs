name: Quality checks

# The full gate. One build job (types, UI) shared as an artifact; static checks and unit tests
# in one job; api and e2e tests in one job, on a fresh runner with the core services, single
# worker (tests share one dev env state). No shards: the whole api + e2e run takes about
# 2 min (measured 2026-10, most of it the cold vite warm-up), less than a runner's setup.
# Used by pull requests and releases; the pre-push hook only
# runs a light subset (dev/pre-push.sh).

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # the generated .type modules are imported by the API, the worker, the tests and the UI build
    - name: Build types
      run: npm run build-types

    # also generates the ui/dts files vue-tsc needs
    - name: Build UI
      run: npm -w ui run build

    - name: Upload build outputs
      uses: actions/upload-artifact@v7
      with:
        name: build
        include-hidden-files: true # the .type directories
        retention-days: 1
        path: |
          **/.type/
          !**/node_modules/**
          ui/dist/
          ui/dts/

  static:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download build outputs
      uses: actions/download-artifact@v8
      with:
        name: build

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run check-types

    - name: Audit
      run: npm audit --omit=dev --audit-level=critical

    # no server needed
    - name: Unit tests
      run: npx playwright test --project=unit

  tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download build outputs
      uses: actions/download-artifact@v8
      with:
        name: build

    # only the browser binaries are cached, keyed on the installed playwright version;
    # the system packages they need are installed on every run
    - name: Read the playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Install playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Init .env
      run: cp dev/default.env .env

    # every later step gets the variables of .env, as npm run dev exports them to its processes
    - name: Export .env to the next steps
      run: grep -vE '^\s*(#|$)' .env >> "$GITHUB_ENV" # GITHUB_ENV accepts only NAME=value lines, no comments

    # the core services only, like a developer's default env: no test needs an optional one.
    # The build above leaves dev-setup nothing to build
    - name: Start dev dependencies
      run: npm run dev-deps

    # the processes of npm run dev, logs in dev/logs for the upload below
    - name: Start dev API, worker and UI
      run: |
        mkdir -p dev/logs
        npm run dev:api > dev/logs/api.log 2>&1 &
        npm run dev:worker > dev/logs/worker.log 2>&1 &
        npm run dev:ui > dev/logs/ui.log 2>&1 &

    - name: Wait for the dev API and UI to be ready
      run: |
        for i in {1..30}; do
          if curl -sf "http://localhost:${DEV_API_PORT}/catalogs/api/test-env" >/dev/null \
            && curl -sf "http://localhost:${DEV_UI_PORT}/catalogs/" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "dev API or UI did not become ready" >&2
        tail -n 50 dev/logs/*.log
        exit 1

    - name: Run api and e2e tests
      run: npx playwright test --project=api --project=e2e

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: |
          test-results/
          dev/logs/
        retention-days: 7

    - name: Docker compose logs on failure
      if: failure()
      run: docker compose --profile '*' logs

    - name: Stop docker compose services
      if: always()
      run: docker compose --profile '*' down
